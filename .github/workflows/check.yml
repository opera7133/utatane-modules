name: Check development packages

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - catalog/ui-verification.json
  workflow_dispatch:
    inputs:
      channel:
        description: Catalog channel to publish
        type: choice
        options: [staging, stable]
        default: staging

concurrency:
  group: utatane-modules-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  catalog:
    if: inputs.channel != 'stable'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.6.14"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --locked python scripts/catalog.py validate
      - run: uv run --locked python -m unittest discover -s tests -v
      - run: uv run --locked python scripts/catalog.py generate --output catalog/generated

  packages:
    needs: catalog
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        group: [native, cpp, minato, pasta]
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.6.14"
          enable-cache: true
      - run: uv sync --locked
      - name: Set up Rust for SHIORI ports
        if: matrix.group == 'minato' || matrix.group == 'pasta'
        run: |
          rustup toolchain install 1.93.0 --profile minimal
          rustup target add --toolchain 1.93.0 aarch64-apple-darwin x86_64-apple-darwin
      - name: Fingerprint package inputs and toolchain
        id: inputs
        run: uv run --locked python scripts/ci_packages.py key ${{ matrix.group }}
      - name: Cache verified packages
        id: packages
        uses: actions/cache@v5
        with:
          path: build/package-cache/${{ matrix.group }}
          key: packages-v1-${{ matrix.group }}-${{ steps.inputs.outputs.key }}
          restore-keys: packages-v1-${{ matrix.group }}-
      - name: Cache Rust dependencies and build outputs
        if: (matrix.group == 'minato' || matrix.group == 'pasta') && steps.packages.outputs.cache-hit != 'true'
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            sources/${{ matrix.group }}/target
            build/cache/${{ matrix.group }}-rust
          key: rust-v2-${{ matrix.group }}-${{ steps.inputs.outputs.key }}
          restore-keys: rust-v2-${{ matrix.group }}-
      - name: Cache shared Swift build outputs
        if: matrix.group == 'native' && steps.packages.outputs.cache-hit != 'true'
        uses: actions/cache@v5
        with:
          path: |
            native/.build
            build/cache/native-swift
          key: swift-v1-${{ steps.inputs.outputs.key }}
          restore-keys: swift-v1-
      - name: Build changed packages or reuse verified ZIPs
        run: uv run --locked python scripts/ci_packages.py build ${{ matrix.group }}
      - uses: actions/upload-artifact@v7
        with:
          name: modules-universal-zips-${{ matrix.group }}
          path: dist/*.zip
          if-no-files-found: error

  verify-arm:
    needs: packages
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.6.14"
          enable-cache: true
      - run: uv sync --locked
      - uses: actions/download-artifact@v8
        with:
          pattern: modules-universal-zips-*
          merge-multiple: true
          path: dist
      - name: Check the same universal ZIPs on arm64
        run: uv run --locked python scripts/smoke_packages.py --report build/abi-arm64.json dist/*.zip
      - uses: actions/upload-artifact@v7
        with:
          name: modules-abi-arm
          path: build/abi-arm64.json
          if-no-files-found: error

  verify-intel:
    needs: packages
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.6.14"
          enable-cache: true
      - run: uv sync --locked
      - uses: actions/download-artifact@v8
        with:
          pattern: modules-universal-zips-*
          merge-multiple: true
          path: dist
      - name: Check the same universal ZIPs on Intel
        run: uv run --locked python scripts/smoke_packages.py --report build/abi-x86_64.json dist/*.zip
      - uses: actions/upload-artifact@v7
        with:
          name: modules-abi-intel
          path: build/abi-x86_64.json
          if-no-files-found: error

  snapshot:
    needs: [catalog, packages, verify-arm, verify-intel]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.6.14"
          enable-cache: true
      - run: uv sync --locked
      - uses: actions/download-artifact@v8
        with:
          pattern: modules-universal-zips-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: modules-abi-intel
          path: build
      - uses: actions/download-artifact@v8
        with:
          name: modules-abi-arm
          path: build
      - name: Generate a self-contained development catalog
        run: uv run --locked python scripts/catalog.py generate --output catalog/generated --package dist/*.zip --abi-report build/abi-x86_64.json --abi-report build/abi-arm64.json
      - name: Verify signing of the complete catalog
        run: |
          openssl genpkey -algorithm Ed25519 -out "$RUNNER_TEMP/catalog-private.pem"
          openssl pkey -in "$RUNNER_TEMP/catalog-private.pem" -pubout -out "$RUNNER_TEMP/catalog-public.pem"
          uv run --locked python scripts/sign_catalog.py sign catalog/generated "$RUNNER_TEMP/catalog-signed" --private-key "$RUNNER_TEMP/catalog-private.pem"
          uv run --locked python scripts/sign_catalog.py verify "$RUNNER_TEMP/catalog-signed" --public-key "$RUNNER_TEMP/catalog-public.pem"
      - uses: actions/upload-artifact@v7
        with:
          name: modules-development-tested
          path: catalog/generated/
          if-no-files-found: error

  publish:
    needs: snapshot
    if: >-
      always() &&
      vars.MODULES_PUBLISH_ENABLED == 'true' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (needs.snapshot.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.channel == 'stable'))
    runs-on: ubuntu-24.04
    environment: modules-publish
    permissions:
      contents: read
    env:
      MODULES_CHANNEL: ${{ inputs.channel || 'staging' }}
      MODULES_DEPLOY_ROOT: ${{ secrets.MODULES_DEPLOY_ROOT }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USERNAME: ${{ secrets.DEPLOY_USERNAME }}
      DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.6.14"
          enable-cache: true
      - run: uv sync --locked
      - uses: actions/download-artifact@v8
        if: env.MODULES_CHANNEL == 'staging'
        with:
          name: modules-development-tested
          path: build/development
      - name: Load signing key
        env:
          MODULES_SIGNING_KEY_B64: ${{ secrets.MODULES_SIGNING_KEY_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test -n "$MODULES_SIGNING_KEY_B64"
          printf '%s' "$MODULES_SIGNING_KEY_B64" | base64 -d > "$RUNNER_TEMP/catalog-private.pem"
          openssl pkey -in "$RUNNER_TEMP/catalog-private.pem" -pubout -out "$RUNNER_TEMP/catalog-public.pem"
          actual=$(openssl pkey -pubin -in "$RUNNER_TEMP/catalog-public.pem" -outform DER | tail -c 32 | base64 -w0)
          expected=$(cat catalog/public-key.txt)
          test "$actual" = "$expected"
      - name: Sign or promote the exact tested snapshot
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$MODULES_CHANNEL" == stable ]]; then
            uv run --locked python scripts/fetch_snapshot.py https://dl.wmsci.com/utatane/modules/preview/ build/staging --public-key "$RUNNER_TEMP/catalog-public.pem"
            uv run --locked python scripts/sign_catalog.py verify build/staging --public-key "$RUNNER_TEMP/catalog-public.pem" --channel staging
            uv run --locked python scripts/sign_catalog.py promote build/staging build/signed --private-key "$RUNNER_TEMP/catalog-private.pem" --ui-evidence catalog/ui-verification.json
          else
            uv run --locked python scripts/sign_catalog.py sign build/development build/signed --private-key "$RUNNER_TEMP/catalog-private.pem" --channel staging
          fi
          uv run --locked python scripts/sign_catalog.py verify build/signed --public-key "$RUNNER_TEMP/catalog-public.pem" --channel "$MODULES_CHANNEL"
      - name: Upload signed catalog and immutable ZIPs
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes lftp
          bash scripts/deploy_ftps.sh build/signed "$MODULES_CHANNEL"
      - name: Verify published HTTPS snapshot
        shell: bash
        run: |
          set -euo pipefail
          base=https://dl.wmsci.com/utatane/modules
          if [[ "$MODULES_CHANNEL" == staging ]]; then
            base="$base/preview"
          fi
          for name in index.json index.sig index.html; do
            curl --fail --show-error --silent --location --retry 5 --retry-all-errors --retry-delay 3 \
              "$base/$name?run=$GITHUB_RUN_ID" -o "$RUNNER_TEMP/$name"
            cmp "build/signed/$name" "$RUNNER_TEMP/$name"
          done
